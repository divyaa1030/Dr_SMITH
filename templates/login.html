{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h3><i class="fas fa-hospital-user"></i> Dr. SMITH</h3>
        <p>Smart Medical Intelligence</p>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login to Patient Portal</button>
        </form>
      </div>
      
      <!-- Updated Footer -->
      <div class="card-footer text-center">
        <a href="{{ url_for('register') }}">New Patient? Register Here</a><br><br>
        <a href="{{ url_for('doctor_login') }}">Medical Service Provider Login</a><br>
        <a href="{{ url_for('doctor_register') }}">New Doctor? Register Here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
