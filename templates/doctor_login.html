{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-header bg-success text-white text-center">
        <h4>Medical Service Provider</h4>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('doctor_login') }}">
          <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="doc@gmail.com" required>
          </div>
          <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" value="password123" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Login as Doctor</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
